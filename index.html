<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>COSPLAY PARTY</title>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0b12;
            --card: #151522;
            --text: #ffffff;
            --muted: #9999ad;
            --accent: #8b5cf6;
            --accent2: #ec4899;
            --gold: #fbbf24;
            --border: rgba(255,255,255,.08);
            --danger: #ef4444;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(139,92,246,.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 10%,
                    rgba(236,72,153,.18),
                    transparent 30%
                ),

                var(--bg);
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: .35;
            cursor: not-allowed;
            transform: none !important;
        }

        .container {
            width: min(
                1100px,
                calc(100% - 32px)
            );

            margin: 0 auto;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 50;

            padding: 20px 0;

            background:
                rgba(11,11,18,.8);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid var(--border);
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    var(--accent2)
                );

            -webkit-background-clip: text;
            color: transparent;
        }

        .admin-open {
            width: 36px;
            height: 36px;

            border-radius: 10px;

            background: transparent;
            border: 1px solid transparent;

            color: #555568;
        }

        .admin-open:hover {
            color: white;

            border-color:
                var(--border);

            background:
                rgba(255,255,255,.04);
        }

        /* HERO */

        .hero {
            padding: 80px 0 50px;
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;

            padding:
                7px 13px;

            border-radius: 999px;

            background:
                rgba(139,92,246,.12);

            border:
                1px solid
                rgba(139,92,246,.25);

            color: #c4b5fd;

            font-size: 13px;
            font-weight: 800;
        }

        h1 {
            margin: 20px 0 0;

            font-size:
                clamp(45px, 8vw, 85px);

            line-height: .95;

            letter-spacing: -4px;
        }

        .gradient-text {
            background:
                linear-gradient(
                    90deg,
                    #a78bfa,
                    #f472b6
                );

            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            max-width: 650px;

            margin:
                25px auto 0;

            color:
                var(--muted);

            font-size: 18px;
            line-height: 1.6;
        }

        /* BUTTONS */

        .btn {
            border: none;

            border-radius: 12px;

            padding:
                13px 20px;

            color: white;

            font-weight: 800;

            transition:
                .2s;
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            box-shadow:
                0 10px 30px
                rgba(139,92,246,.22);
        }

        .btn-primary:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(139,92,246,.35);
        }

        .btn-secondary {
            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                var(--border);
        }

        .btn-danger {
            background:
                rgba(239,68,68,.13);

            color:
                #fca5a5;

            border:
                1px solid
                rgba(239,68,68,.2);
        }

        /* SECTIONS */

        section {
            padding: 35px 0;
        }

        .section-title {
            margin:
                0 0 8px;

            font-size: 30px;
        }

        .section-subtitle {
            margin:
                0 0 25px;

            color:
                var(--muted);
        }

        .card {
            background:
                rgba(21,21,34,.86);

            border:
                1px solid
                var(--border);

            border-radius: 20px;

            padding: 24px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.15);
        }

        /* REGISTRATION */

        .registration {
            max-width: 700px;
            margin: 0 auto;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full {
            grid-column:
                1 / -1;
        }

        label {
            color: #c7c7d5;

            font-size: 13px;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;

            padding:
                13px 15px;

            background:
                #0e0e17;

            border:
                1px solid
                var(--border);

            border-radius: 11px;

            color: white;

            outline: none;
        }

        input[type="text"]:focus {
            border-color:
                var(--accent);
        }

        .upload {
            padding: 25px;

            text-align: center;

            color:
                var(--muted);

            border:
                2px dashed
                rgba(255,255,255,.12);

            border-radius: 14px;
        }

        .upload:hover {
            border-color:
                var(--accent);
        }

        .preview {
            display: none;

            width: 150px;
            height: 150px;

            margin:
                15px auto 0;

            object-fit: cover;

            border-radius: 16px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;

            margin-top: 20px;
        }

        /* PARTICIPANTS */

        .participants-grid {
            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 16px;
        }

        .participant {
            padding: 0;
            overflow: hidden;
        }

        .participant img {
            display: block;

            width: 100%;

            aspect-ratio:
                1 / 1;

            object-fit: cover;
        }

        .participant-info {
            padding: 15px;
        }

        .participant-name {
            font-size: 18px;
            font-weight: 900;
        }

        .participant-character {
            margin-top: 5px;

            color:
                var(--muted);

            font-size: 13px;
        }

        /* VOTING */

        .question {
            margin-bottom: 30px;
        }

        .question-header {
            display: flex;

            gap: 15px;

            align-items:
                flex-start;

            margin-bottom: 18px;
        }

        .question-number {
            width: 36px;
            height: 36px;

            display: grid;
            place-items: center;

            flex-shrink: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            font-weight: 900;
        }

        .question-title {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.35;
        }

        .question-hint {
            margin-top: 5px;

            color:
                var(--muted);

            font-size: 13px;
        }

        .voting-list {
            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 12px;
        }

        .vote-card {
            overflow: hidden;

            background:
                #10101a;

            border:
                1px solid
                var(--border);

            border-radius: 15px;
        }

        .vote-card img {
            width: 100%;

            aspect-ratio:
                1 / 1;

            object-fit: cover;
        }

        .vote-card-content {
            padding: 12px;
        }

        .vote-name {
            margin-bottom: 10px;

            font-weight: 800;
        }

        .points {
            display: flex;
            gap: 5px;
        }

        .point {
            position: relative;

            flex: 1;

            padding: 8px 4px;

            color: #aaa;

            background:
                rgba(255,255,255,.04);

            border:
                1px solid
                var(--border);

            border-radius: 8px;

            font-weight: 900;
        }

        .point.selected {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            border-color:
                transparent;
        }

        .point[data-points="3"]::after {
            content: "★";

            position: absolute;

            top: -8px;
            right: -5px;

            color:
                var(--gold);

            font-size: 11px;
        }

        .vote-submit {
            display: flex;

            justify-content: center;

            margin: 30px 0;
        }

        /* EGOR */

        .egor-card {
            max-width: 700px;

            margin: 0 auto;

            text-align: center;
        }

        .egor-title {
            font-size: 34px;
        }

        .egor-buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 25px;
        }

        .egor-btn {
            min-width: 160px;

            padding:
                15px 20px;

            color: white;

            background:
                rgba(255,255,255,.05);

            border:
                1px solid
                var(--border);

            border-radius: 14px;

            font-weight: 900;
        }

        /* RESULTS */

        .podium {
            display: grid;

            grid-template-columns:
                1fr 1.15fr 1fr;

            gap: 15px;

            align-items: end;

            max-width: 800px;

            margin:
                40px auto;
        }

        .place {
            padding: 20px;

            text-align: center;

            background:
                rgba(255,255,255,.04);

            border:
                1px solid
                var(--border);

            border-radius: 18px;
        }

        .place.first {
            padding-top: 40px;
            padding-bottom: 40px;

            border-color:
                rgba(251,191,36,.35);
        }

        .place-medal {
            font-size: 40px;
        }

        .place img {
            width: 110px;
            height: 110px;

            object-fit: cover;

            border-radius: 50%;
        }

        .place.first img {
            width: 135px;
            height: 135px;

            border:
                3px solid
                var(--gold);
        }

        .place-name {
            margin-top: 12px;

            font-size: 19px;
            font-weight: 900;
        }

        .place-score {
            margin-top: 6px;

            color:
                var(--muted);
        }

        .egor-result {
            max-width: 600px;

            margin:
                30px auto;

            padding: 30px;

            text-align: center;

            border-radius: 20px;

            background:
                rgba(255,255,255,.03);

            border:
                1px solid
                rgba(236,72,153,.2);
        }

        .egor-percent {
            font-size: 65px;
            font-weight: 1000;

            background:
                linear-gradient(
                    90deg,
                    #f472b6,
                    #fb7185
                );

            -webkit-background-clip: text;

            color: transparent;
        }

        /* ADMIN */

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-top {
            display: flex;

            justify-content:
                space-between;

            gap: 15px;

            align-items: center;

            margin-bottom: 20px;
        }

        .admin-buttons {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .admin-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .admin-user {
            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            padding: 12px;

            background:
                rgba(255,255,255,.03);

            border:
                1px solid
                var(--border);

            border-radius: 12px;
        }

        .admin-user-left {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .admin-user img {
            width: 55px;
            height: 55px;

            object-fit: cover;

            border-radius: 10px;
        }

        .admin-checkbox {
            display: flex;

            gap: 8px;

            align-items: center;

            color: #ddd;
        }

        /* MODAL */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.75);

            backdrop-filter:
                blur(8px);
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            width:
                min(420px,100%);

            padding: 25px;

            background:
                #161622;

            border:
                1px solid
                var(--border);

            border-radius: 20px;
        }

        /* TOAST */

        .toast {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 200;

            padding:
                14px 18px;

            background:
                #1b1b2a;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            transform:
                translateY(100px);

            opacity: 0;

            transition: .3s;
        }

        .toast.show {
            transform:
                translateY(0);

            opacity: 1;
        }

        .empty {
            padding: 40px;

            text-align: center;

            color:
                var(--muted);
        }

        /* MOBILE */

        @media(max-width:800px) {

            .participants-grid {
                grid-template-columns:
                    repeat(2,1fr);
            }

            .voting-list {
                grid-template-columns:
                    repeat(2,1fr);
            }

            .podium {
                grid-template-columns:
                    1fr;
            }

            .place.first {
                order: -1;
            }

            .admin-top {
                flex-direction:
                    column;

                align-items:
                    flex-start;
            }
        }

        @media (max-width: 560px) {

            * {
                max-width: 100%;
            }

            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .container {
                width: 100%;
                max-width: 100%;
                padding-left: 10px;
                padding-right: 10px;
            }

            .hero {
                padding: 45px 10px 25px;
            }

            h1 {
                font-size: 46px;
                letter-spacing: -2px;
                word-break: normal;
            }

            .hero p {
                font-size: 15px;
                padding: 0 5px;
            }

            .card {
                width: 100%;
                max-width: 100%;
                padding: 16px;
                overflow: hidden;
            }

            .registration {
                width: 100%;
                max-width: 100%;
            }

            .form-grid {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 14px;
            }

            .field,
            .full {
                width: 100%;
                min-width: 0;
            }

            .field input,
            input[type="text"] {
                display: block;
                width: 100%;
                max-width: 100%;
                min-width: 0;
                height: 48px;
                padding: 12px;
                box-sizing: border-box;
            }

            .upload {
                width: 100%;
                max-width: 100%;
                padding: 20px 10px;
                overflow: hidden;
            }

            .upload input[type="file"] {
                display: block;
                width: 100%;
                max-width: 100%;
                min-width: 0;
                margin-top: 12px;
                font-size: 13px;
                overflow: hidden;
            }

            input,
            button,
            select,
            textarea {
                max-width: 100%;
            }

            .preview {
                max-width: 150px;
            }

            .form-actions {
                width: 100%;
            }

            .form-actions .btn {
                width: 100%;
            }

            .participants-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                width: 100%;
            }

            .participant {
                min-width: 0;
                width: 100%;
            }

            .participant img {
                width: 100%;
                max-width: 100%;
            }

            .participant-info {
                padding: 10px;
                overflow: hidden;
            }

            .participant-name {
                font-size: 14px;
                overflow-wrap: anywhere;
            }

            .participant-character {
                font-size: 12px;
                overflow-wrap: anywhere;
            }

            .voting-list {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                width: 100%;
            }

            .vote-card {
                min-width: 0;
                width: 100%;
                overflow: hidden;
            }

            .vote-card img {
                width: 100%;
                max-width: 100%;
            }

            .vote-card-content {
                padding: 8px;
            }

            .vote-name {
                font-size: 13px;
                overflow-wrap: anywhere;
            }

            .points {
                width: 100%;
                gap: 3px;
            }

            .point {
                min-width: 0;
                padding: 8px 2px;
                font-size: 12px;
            }

            .question {
                width: 100%;
                max-width: 100%;
                overflow: hidden;
            }

            .question-header {
                gap: 10px;
            }

            .question-title {
                font-size: 16px;
                line-height: 1.3;
            }

            .question-hint {
                font-size: 12px;
            }

            .egor-card {
                width: 100%;
                max-width: 100%;
            }

            .egor-title {
                font-size: 27px;
            }

            .egor-buttons {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }

            .egor-btn {
                width: 100%;
                max-width: 100%;
                min-width: 0;
            }

            .podium {
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: 100%;
                gap: 10px;
            }

            .place {
                width: 100%;
                max-width: 100%;
            }

            .place.first {
                order: -1;
            }

            .egor-result {
                width: 100%;
                max-width: 100%;
                padding: 25px 15px;
            }

            .egor-percent {
                font-size: 55px;
            }

            .admin-top {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }

            .admin-buttons {
                display: flex;
                flex-direction: column;
                width: 100%;
            }

            .admin-buttons .btn {
                width: 100%;
            }

            .admin-user {
                width: 100%;
                min-width: 0;
                flex-direction: column;
                align-items: stretch;
            }

            .admin-user-left {
                min-width: 0;
                max-width: 100%;
            }

            .admin-user-left > div {
                min-width: 0;
                overflow-wrap: anywhere;
            }

            .admin-checkbox {
                width: 100%;
            }

            .btn {
                max-width: 100%;
                white-space: normal;
            }

            .modal {
                padding: 10px;
            }

            .modal-card {
                width: 100%;
                max-width: 100%;
                padding: 20px;
            }

            .modal-card input {
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box;
            }

            .section-title {
                font-size: 25px;
            }

            .section-subtitle {
                font-size: 14px;
            }
        }

    </style>

</head>

<body>

<header>

    <div class="container nav">

        <div class="logo">
            COSPLAY <span>PARTY</span>
        </div>

        <button
            class="admin-open"
            onclick="openAdminLogin()"
        >
            •••
        </button>

    </div>

</header>

<main>

    <!-- HERO -->

    <section class="hero">

        <div class="container">

            <div class="hero-badge">
                ✦ COSPLAY PARTY
            </div>

            <h1>
                Кто сегодня<br>

                <span class="gradient-text">
                    легенда?
                </span>
            </h1>

            <p>
                Оценивай костюмы, сходство
                с персонажем и общий
                вау-эффект.
            </p>

            <div style="margin-top:28px">

                <button
                    class="btn btn-primary"
                    onclick="scrollToRegistration()"
                >
                    Участвовать
                </button>

            </div>

        </div>

    </section>

    <!-- REGISTRATION -->

    <section
        id="registrationSection"
        style="display:none"
    >

        <div class="container">

            <div
                class
